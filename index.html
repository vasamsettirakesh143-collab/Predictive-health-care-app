<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personalised Predictive Healthcare</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <h1>Personalised Predictive Healthcare</h1>
    <p class="subtitle">ML risk prediction + AI-generated personalised guidance</p>

    <form id="healthForm">
      <div class="grid">
        <label>Age
          <input type="number" name="age" value="45" min="18" max="100" required>
        </label>
        <label>BMI
          <input type="number" step="0.1" name="bmi" value="27.5" min="15" max="50" required>
        </label>
        <label>Fasting Glucose (mg/dL)
          <input type="number" step="0.1" name="glucose" value="105" min="60" max="300" required>
        </label>
        <label>Blood Pressure (systolic)
          <input type="number" step="0.1" name="blood_pressure" value="125" min="80" max="200" required>
        </label>
        <label>Cholesterol (mg/dL)
          <input type="number" step="0.1" name="cholesterol" value="195" min="100" max="350" required>
        </label>
        <label>Activity Level
          <select name="activity_level">
            <option value="0">Low</option>
            <option value="1" selected>Moderate</option>
            <option value="2">High</option>
          </select>
        </label>
        <label>Smoking
          <select name="smoking">
            <option value="0" selected>No</option>
            <option value="1">Yes</option>
          </select>
        </label>
        <label>Family History of Diabetes
          <select name="family_history">
            <option value="0" selected>No</option>
            <option value="1">Yes</option>
          </select>
        </label>
      </div>
      <button type="submit">Get Risk Assessment</button>
    </form>

    <div id="result" class="result hidden">
      <div class="risk-badge" id="riskBadge"></div>
      <h2>Personalised Report</h2>
      <p id="explanationText" class="explanation"></p>
      <p class="source" id="sourceNote"></p>
    </div>

    <div id="errorBox" class="error hidden"></div>
  </div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
