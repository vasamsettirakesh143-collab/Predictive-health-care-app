services:
  - type: web
    name: predictive-healthcare-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Optional: add ANTHROPIC_API_KEY in the Render dashboard (Environment tab)
      # to enable live GenAI explanations instead of the built-in template.
